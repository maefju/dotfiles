# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty
#
# Example for xwayland
xwayland {
  force_zero_scaling = true
}

# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL version
# env = SDL_VIDEODRIVER,wayland
env = SDL_VIDEODRIVER,x11

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Uncomment in case you have issues with screensharing
# exec-once = ~/.config/hypr/scripts/xdg.sh

# scaling factor for GTK applications
env = GDK_SCALE,1.75


#split monitor workspaces plugin configuration
plugin {
    split-monitor-workspaces {
        count = 5
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
    }
}

# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  sensitivity = -0.775

  # Disable mouse acceleration
  accel_profile = flat

  # Default: standard de layout with dead keys (overrides keyboard.conf)
  # kb-variant-switcher.sh will change this dynamically per focused window
  kb_variant =
}

exec-once = hyprpm reload -n

# Per-window keyboard variant switcher
exec-once = ~/.config/hypr/scripts/kb-variant-switcher.sh
exec-one = powerprofilesctl set performance
