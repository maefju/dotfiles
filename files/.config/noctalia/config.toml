[plugin_settings."alexander/screen-toolkit"]
hide-cursor = false
selected-ocr-lang = "eng+deu"

[plugins]
enabled = [ "noctalia/wallhaven", "alexander/screen-toolkit" ]

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "pkexec"

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    size = 97

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper.automation]
enabled = true

[wallpaper.default]
path = "/home/maefju/Pictures/Wallpapers/wallhaven-6lpzx7.jpg"

[wallpaper.last]
path = "/home/maefju/Pictures/Wallpapers/wallhaven-6lpzx7.jpg"

[wallpaper.monitors.DP-1]
path = "/home/maefju/Pictures/Wallpapers/wallhaven-6lpzx7.jpg"

[wallpaper.monitors.DP-2]
path = "/home/maefju/Pictures/Wallpapers/wallhaven-6lpzx7.jpg"

[widget.active_window]
enabled = false

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %d.%m.%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.sysmon_2]
show_value = true
show_glyph = true
visualization = "graph"
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
display = "text"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
active_pill_size = 2.0
capsule = true
capsule_fill = "on_primary"
show_labels = false
inactive_pill_size = 1.0
pill_scale = 0.80000000000000004
urgent_color = "#FB9507"
