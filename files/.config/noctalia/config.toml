[accessibility]
ui_scale = 1.0000000074505806

[bar.default]
background_opacity = 0.64999998547136784
center = [ "workspaces" ]
concave_edge_corners = true
contact_shadow = true
end = [ "media", "spacer_1", "widget", "wallpaper", "group:g1", "notifications", "network", "volume", "session" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.1000000000000001
start = [ "launcher", "clock", "spacer_1", "tray" ]
thickness = 35
widget_spacing = 10

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

[control_center.calendar]
show_week_numbers = true

[location]
